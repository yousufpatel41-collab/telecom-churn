<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" role="img" aria-labelledby="title desc"><title id="title">Held-out confusion matrix</title><desc id="desc">Rows are actual class; columns are predicted class. Values are held-out record counts.</desc><rect width="640" height="330" rx="8" fill="#f3f5f1"/><g font-family="Arial,sans-serif" fill="#20382c"><text x="28" y="35" font-size="19" font-weight="bold">Held-out evaluation</text><text x="28" y="58" font-size="12">xgboost · 1409 records · threshold 0.5</text><text x="168" y="94" font-size="12">Predicted 0</text><text x="288" y="94" font-size="12">Predicted 1</text><text x="28" y="147" font-size="13">Actual 0</text><rect x="139" y="108" width="110" height="65" rx="4" fill="#d3e6d8"/><text x="194" y="150" text-anchor="middle" font-size="26">929</text><rect x="259" y="108" width="110" height="65" rx="4" fill="#f0dcc8"/><text x="314" y="150" text-anchor="middle" font-size="26">106</text><text x="28" y="223" font-size="13">Actual 1</text><rect x="139" y="184" width="110" height="65" rx="4" fill="#f0dcc8"/><text x="194" y="226" text-anchor="middle" font-size="26">175</text><rect x="259" y="184" width="110" height="65" rx="4" fill="#d3e6d8"/><text x="314" y="226" text-anchor="middle" font-size="26">199</text><text x="414" y="120" font-size="12">ROC-AUC</text><text x="414" y="144" font-size="22">0.8384</text><text x="414" y="169" font-size="12">Accuracy</text><text x="414" y="193" font-size="22">80.06%</text><text x="414" y="218" font-size="12">Recall</text><text x="414" y="242" font-size="22">53.21%</text><text x="28" y="296" font-size="11">One stratified split; training CV selected the model before test evaluation.</text></g></svg>
